[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macrocast-lab"
version = "0.2.0"
description = "Vintage-aware unemployment forecasting with honest baseline comparisons"
requires-python = ">=3.12"
dependencies = [
    "numpy", "pandas", "scikit-learn", "statsmodels", "matplotlib", "openpyxl", "threadpoolctl"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
macrocast = "macrocast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
